name: Build Figura using Gradle
on: [pull_request, push]

jobs:
  build:
    if: github.actor != 'weblate'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true

      - name: Build using Gradle
        run: ./gradlew build

      - name: Upload Fabric artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Artifacts
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-shadow.jar

      - name: Upload Forge artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Artifacts
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-dev.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-shadow.jar
